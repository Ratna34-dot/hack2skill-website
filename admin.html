<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dashboard">
  <nav class="navbar navbar-dark bg-danger shadow">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">Smart Campus - Admin Panel</span>
      <button class="btn btn-outline-light" id="logoutBtn">Logout</button>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="alert alert-info text-center shadow mb-5 border-0">
      <h3>Welcome, Admin!</h3>
      <p class="mb-0">You have full authority to manage and resolve complaints.</p>
    </div>

    <!-- Compact & Pleasant Stats Cards -->
    <div class="row mb-5 g-3">
      <!-- Pending Complaints -->
      <div class="col-md-4 col-12">
        <div class="card bg-light border-0 shadow-sm text-center">
          <div class="card-body py-3">
            <h3 class="fw-bold text-warning mb-1" id="pendingCount">0</h3>
            <p class="fs-6 text-muted mb-0">Pending</p>
          </div>
        </div>
      </div>

      <!-- Resolved Complaints -->
      <div class="col-md-4 col-12">
        <div class="card bg-light border-0 shadow-sm text-center">
          <div class="card-body py-3">
            <h3 class="fw-bold text-success mb-1" id="resolvedCount">0</h3>
            <p class="fs-6 text-muted mb-0">Resolved</p>
          </div>
        </div>
      </div>

      <!-- Total Complaints -->
      <div class="col-md-4 col-12">
        <div class="card bg-light border-0 shadow-sm text-center">
          <div class="card-body py-3">
            <h3 class="fw-bold text-primary mb-1" id="totalCount">0</h3>
            <p class="fs-6 text-muted mb-0">Total Complaints</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="mb-4">
      <div class="input-group input-group-lg shadow">
        <span class="input-group-text bg-white border-end-0">🔍</span>
        <input type="text" id="adminSearchInput" class="form-control border-start-0" placeholder="Search complaints by title, description, location, or category..." aria-label="Search">
      </div>
      <small class="text-white d-block mt-2 text-center">Type to filter complaints instantly</small>
    </div>

    <h3 class="text-white mb-4 text-center">All Complaints - Admin View</h3>
    <div id="complaintsList" class="row g-4"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
