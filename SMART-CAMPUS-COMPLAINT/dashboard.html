<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dashboard">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">Smart Campus Complaints</span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#profile">Profile</a></li>
          <li class="nav-item"><a class="nav-link" data-bs-toggle="modal" data-bs-target="#complaintModal" style="cursor:pointer;">Add Complaint</a></li>
          <li class="nav-item"><button class="btn btn-outline-light" id="logoutBtn">Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-5">
    <!-- Welcome Message -->
    <div class="text-center text-white mb-4">
      <h2 class="display-6 fw-bold">Welcome back, <span id="welcomeName"></span>!</h2>
      <p class="lead">Submit and track your campus complaints easily.</p>
    </div>

    <!-- Smaller Profile Card -->
    <div id="profile" class="card mb-4 shadow p-3" style="background: rgba(255,255,255,0.95); border-radius: 15px;">
      <div class="card-body py-3">
        <h5 class="card-title text-primary mb-3">Your Profile</h5>
        <div class="row g-3">
          <div class="col-md-6">
            <p class="mb-2"><strong>Name:</strong> <span id="userName" class="fw-bold text-dark"></span></p>
            <p class="mb-2"><strong>Email:</strong> <span id="userEmail" class="fw-bold text-dark"></span></p>
          </div>
          <div class="col-md-6">
            <p class="mb-2"><strong>Campus ID:</strong> <span id="userCampusId" class="fw-bold text-dark"></span></p>
            <p class="mb-2"><strong>Role:</strong> <span id="userRole" class="badge bg-info text-dark px-3 py-2"></span></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Smaller Stats Boxes -->
    <div class="row mb-4 g-3">
      <div class="col-md-6 col-12">
        <div class="card bg-primary text-white shadow border-0 text-center">
          <div class="card-body py-3">
            <h3 class="fw-bold mb-0" id="myPendingCount">0</h3>
            <p class="fs-5 fw-bold mb-0 mt-2">Your Pending Complaints</p>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-12">
        <div class="card bg-success text-white shadow border-0 text-center">
          <div class="card-body py-3">
            <h3 class="fw-bold mb-0" id="myResolvedCount">0</h3>
            <p class="fs-5 fw-bold mb-0 mt-2">Your Resolved Complaints</p>
          </div>
        </div>
      </div>
    </div>

    <!-- My Complaints Section -->
    <h4 class="text-white mb-3 text-center">My Complaints</h4>
    <div id="myComplaintsList" class="row g-4 mb-5"></div>

    <!-- All Campus Complaints -->
    <h4 class="text-white mb-3 text-center">All Campus Complaints</h4>
    <div id="complaintsList" class="row g-4"></div>
  </div>

  <!-- Add Complaint Modal with Location Field -->
  <div class="modal fade" id="complaintModal">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 20px;">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Submit New Complaint</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <form id="complaintForm">
            <div class="mb-4">
              <label class="form-label fw-bold">Title</label>
              <input type="text" class="form-control form-control-lg shadow-sm" id="title" placeholder="e.g., Broken fan in room" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold">Category</label>
              <select class="form-select form-select-lg shadow-sm" id="category" required>
                <option value="" disabled selected>Choose category</option>
                <option>Maintenance</option>
                <option>Hostel</option>
                <option>Academics</option>
                <option>Mess/Food</option>
                <option>Security</option>
                <option>Other</option>
              </select>
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold">Location <small class="text-muted">(e.g., Hostel Block B, Room 305)</small></label>
              <input type="text" class="form-control shadow-sm" id="location" placeholder="Describe where the problem is" required>
            </div>
            <div class="mb-4">
              <label class="form-label fw-bold">Description</label>
              <textarea class="form-control shadow-sm" id="description" rows="6" placeholder="Explain the issue in detail..." required></textarea>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 shadow">Submit Complaint</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  </body>
</html>
